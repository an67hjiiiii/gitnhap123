# nginx trong ảnh Docker giao diện: trả trang tĩnh, mọi đường dẫn của ứng dụng về index.html, /api chuyển sang backend.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  # tệp tải lên tối đa 2 MB ở backend; để dư cho phần đầu multipart
  client_max_body_size 4m;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # một lượt hỏi chạy mô hình cục bộ có thể mất vài phút
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
  }

  # tệp có mã băm trong tên: lưu đệm lâu
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
